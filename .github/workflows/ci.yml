# Oppa workspace gates (mirrors the protocol in
# docs/CONTRIBUTING.md: fmt, clippy,
# wasm-target check, full workspace test suite). Plain `clippy`
# (no -D warnings): one pre-existing `FpsApp` lint is on record.
name: ci

on: [push, pull_request]

jobs:
  gates:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/web/package-lock.json
      - name: node deps
        # Browser rows (oppa-dom m7_dom) shell out to node spike/web/*.mjs
        # with a real Edge; deps install here, never committed.
        run: npm ci
        working-directory: spike/web
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets
      - name: wasm check
        run: cargo check --target wasm32-unknown-unknown -p oppa -p oppa-controls -p oppa-dom -p oppa-web
      - name: workspace tests
        run: cargo test --workspace -j1
