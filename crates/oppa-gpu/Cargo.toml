[package]
name = "oppa-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Universal GPU vector & batch rasterizer on wgpu render pipelines (zero compute shaders)"

[lib]
path = "src/lib.rs"

[dependencies]
oppa = { path = "../oppa" }
oppa-cpu = { path = "../oppa-cpu" }
tiny-skia = "0.12"
wgpu = "29"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.4"
web-time = "1"
ab_glyph = "0.2"
lyon_tessellation = "1.0"

[dev-dependencies]
oppa-controls = { path = "../oppa-controls" }

[target.'cfg(windows)'.dev-dependencies]
oppa-text-dwrite = { path = "../oppa-text-dwrite" }
