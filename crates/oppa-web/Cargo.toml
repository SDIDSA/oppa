[package]
name = "oppa-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal shippable web story: the oppa DOM backend behind a wasm event-loop binding (no new renderer features)"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
oppa = { path = "../oppa" }
oppa-controls = { path = "../oppa-controls" }
oppa-cpu = { path = "../oppa-cpu" }
oppa-dom = { path = "../oppa-dom" }
oppa-fonts = { path = "../oppa-fonts" }
oppa-text-rustybuzz = { path = "../oppa-text-rustybuzz" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "History", "Location", "Storage", "MediaQueryList"] }
