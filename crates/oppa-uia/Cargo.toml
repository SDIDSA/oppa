[package]
name = "oppa-uia"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M10 close-v1: Windows UIA provider over the retained semantics tree (toggle/list-item queryable through real UIA interfaces)"

[dependencies]
oppa = { path = "../oppa" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
oppa-macros = { path = "../oppa-macros" }
