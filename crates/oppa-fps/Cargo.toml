[package]
name = "oppa-fps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform FPS counter example (Windows, Linux, Android, Web): one ComponentHost scene, Vello GPU with softbuffer CPU fallback, bundled DejaVu text"

[lib]
name = "oppa_fps"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oppa-fps"
path = "src/main.rs"

[dependencies]
oppa = { path = "../oppa" }
oppa-macros = { path = "../oppa-macros" }
oppa-cpu = { path = "../oppa-cpu" }
oppa-vello = { path = "../oppa-vello" }
oppa-text-rustybuzz = { path = "../oppa-text-rustybuzz" }
oppa-fonts = { path = "../oppa-fonts" }
winit = { version = "0.30", default-features = false, features = ["x11", "x11-dl", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = "0.4"
wgpu = "29"
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Location", "Navigator", "Window"] }

[target.'cfg(target_os = "android")'.dependencies]
# native-activity (not game-activity): cargo-apk's manifest entry
# is android.app.NativeActivity; winit unifies on the same crate.
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "com.oppa.fps"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35
