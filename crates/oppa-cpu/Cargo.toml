[package]
name = "oppa-cpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "M4 CPU raster backend (tiny-skia): FramePlan builder from dirty subtrees, per-surface commit path, image-diff oracle"

[lib]
path = "src/lib.rs"

[dependencies]
oppa = { path = "../oppa" }
tiny-skia = "0.12"
ab_glyph = "0.2"

[dev-dependencies]
oppa-macros = { path = "../oppa-macros" }

[target.'cfg(windows)'.dev-dependencies]
oppa-text-dwrite = { path = "../oppa-text-dwrite" }
