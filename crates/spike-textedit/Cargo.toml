[package]
name = "spike-textedit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "DESIGN §9.2 text-editing spike: Windows-GPU arm (framework-authority editing session over DWriteTextService), shared rig definitions, caret oracles"

[lib]
path = "src/lib.rs"

[dependencies]
oppa = { path = "../oppa" }
vello = "0.10"
wgpu = "29"
raw-window-handle = "0.6"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
oppa-shell-win = { path = "../oppa-shell-win" }
oppa-text-dwrite = { path = "../oppa-text-dwrite" }
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
]
