[package]
name = "oppa-android-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M10 on-device proof app: Kitchen Sink scene render (CPU + GLES arms) with timings, driven by NativeActivity, no Java"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
oppa = { path = "../oppa" }
oppa-controls = { path = "../oppa-controls" }
oppa-cpu = { path = "../oppa-cpu" }
oppa-vello = { path = "../oppa-vello" }
oppa-text-android = { path = "../oppa-text-android" }
oppa-shell-android = { path = "../oppa-shell-android" }
tiny-skia = "0.12"
wgpu = "29"
raw-window-handle = "0.6"
jni = "0.21"
ndk = { version = "0.9", features = ["rwh_06"] }
android-activity = { version = "0.6", features = ["native-activity"] }
