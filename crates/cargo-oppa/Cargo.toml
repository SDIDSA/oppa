[package]
name = "cargo-oppa"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cargo-oppa: the Oppa scaffolder (cargo oppa new — Phase 37c, decision 365)"

[[bin]]
name = "cargo-oppa"
path = "src/main.rs"

[lib]
name = "cargo_oppa"
path = "src/lib.rs"

[dependencies]
# APK assembly (unsigned zip + dex/so entries — no system zip tool
# needed on any host).
zip = "2"
