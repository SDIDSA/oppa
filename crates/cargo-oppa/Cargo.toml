[package]
name = "cargo-oppa"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cargo-oppa: the Oppa scaffolder (cargo oppa new — Phase 37c, decision 365)"

[[bin]]
name = "cargo-oppa"
path = "src/main.rs"

[lib]
name = "cargo_oppa"
path = "src/lib.rs"

[dependencies]
# APK assembly (unsigned zip + dex/so entries — no system zip tool
# needed on any host).
zip = "2"

[dev-dependencies]
# Shaping proof for add-font tests (generated faces must shape, not
# just parse — product code stays dependency-free on purpose).
oppa = { path = "../oppa" }
oppa-text-rustybuzz = { path = "../oppa-text-rustybuzz" }
