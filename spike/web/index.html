<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: content-box; }
  html, body { background: #fff; overflow: hidden; }
  #field {
    position: absolute; left: 0; top: 16px;
    width: 460px; height: 28px; line-height: 28px;
    font: 16px/28px "Segoe UI", sans-serif;
    font-kerning: none;
    font-feature-settings: "liga" 0, "clig" 0, "kern" 0;
    letter-spacing: 0;
    text-rendering: optimizeSpeed;
    padding: 0; border: 0; outline: none;
  }
  #probe {
    position: absolute; left: 0; top: 64px;
    opacity: 0; white-space: pre;
    font: 16px/28px "Segoe UI", sans-serif;
    font-kerning: none;
    font-feature-settings: "liga" 0, "clig" 0, "kern" 0;
    letter-spacing: 0;
    text-rendering: optimizeSpeed;
  }
</style>
</head>
<body>
<input id="field" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
<div id="probe"></div>
<script>
(() => {
  const field = document.getElementById('field');
  const probe = document.getElementById('probe');
  window.__events = [];

  const log = (e) => { window.__events.push(e); };

  // The hook's only job is RECORDING what the DOM natively reports — no
  // IME handling, no selection overriding, no custom editors.
  for (const type of ['compositionstart', 'compositionupdate', 'compositionend']) {
    field.addEventListener(type, (e) => log({
      t: 'composition', type: e.type, data: e.data,
      selStart: field.selectionStart, selEnd: field.selectionEnd,
      value: field.value,
    }));
  }
  field.addEventListener('beforeinput', (e) => log({
    t: 'beforeinput', type: e.inputType, data: e.data,
    composing: e.isComposing, value: field.value,
  }));
  document.addEventListener('selectionchange', () => log({
    t: 'selection', start: field.selectionStart, end: field.selectionEnd,
    dir: field.selectionDirection, value: field.value,
  }));
  field.addEventListener('focus', () => log({ t: 'focus' }));
  field.addEventListener('blur', () => log({ t: 'blur' }));

  window.__resetEvents = () => { window.__events.length = 0; };
  window.__state = () => {
    let caretRect = null;
    try {
      const sel = window.getSelection();
      if (sel.rangeCount) {
        const r = sel.getRangeAt(0).getBoundingClientRect();
        caretRect = { x: r.left, y: r.top, w: r.width, h: r.height };
      }
    } catch (e) {}
    return {
      value: field.value,
      start: field.selectionStart,
      end: field.selectionEnd,
      caretRect,
    };
  };

  // Geometry probe (diagnostic only, not a pass/fail surface): the browser's
  // own text-offset boundary positions via caretRangeFromPoint, used to
  // classify hit-test mismatches as geometry-level vs rule-level.
  window.__probeBoundary = (text, x, y) => {
    probe.textContent = text;
    const range = document.caretRangeFromPoint(x, y);
    if (!range) return null;
    return range.startOffset;
  };
  window.__setFont = (stack) => {
    field.style.fontFamily = stack;
    probe.style.fontFamily = stack;
  };
})();
</script>
</body>
</html>
